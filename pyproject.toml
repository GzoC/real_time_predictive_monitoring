[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "industrial-condition-monitor"
version = "0.2.0"
description = "Reproducible industrial condition classification and simulated telemetry"
requires-python = ">=3.11,<3.15"
readme = "README.md"
license = "MIT"
authors = [{name = "GzoC"}]
dependencies = [
  "numpy>=2,<3", "pandas>=2.2,<3", "scikit-learn>=1.7,<1.10", "joblib>=1.4,<2",
  "fastapi>=0.115,<1", "pydantic>=2.10,<3", "uvicorn>=0.34,<1",
  "streamlit>=1.50,<2", "requests>=2.32,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "httpx>=0.28,<0.29", "ruff>=0.11,<1", "nbformat>=5,<6", "nbclient>=0.10,<1", "ipykernel>=6,<8"]

[project.scripts]
condition-monitor = "predictive_monitor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["predictive_monitor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
